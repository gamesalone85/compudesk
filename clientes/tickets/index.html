<!DOCTYPE html>
<html lang="es-MX">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Mis Tickets | Compu Desk
</title>


<link rel="icon" href="../../img/logo.png">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link rel="stylesheet" href="../css/cliente.css">
<link rel="stylesheet" href="../css/tickets.css">


</head>


<body>



<header class="cliente-header">


<div class="brand">


<img src="../../img/logo.png">


<div>

<h2>
Compu Desk
</h2>


<span>
Portal Cliente
</span>


</div>


</div>



<div class="header-actions">


<a href="../dashboard.html" class="secondary-button">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>


</div>


</header>







<main class="cliente-container">

    <section class="empresa-card">

        <div class="section-header ticket-header">

            <div>

                <h2>
                    <i class="fa-solid fa-ticket"></i>
                    Mis Tickets
                </h2>

                <p class="section-description">
                    Consulta el estado de todas tus solicitudes de soporte.
                </p>

            </div>

            <a href="nuevo.html" class="primary-button">
                <i class="fa-solid fa-plus"></i>
                Nuevo Ticket
            </a>

        </div>

        <!-- KPIs -->

        <div class="ticket-kpis">

            <div class="ticket-kpi">
                <span>Total</span>
                <strong id="kpiTotal">0</strong>
            </div>

            <div class="ticket-kpi">
                <span>Abiertos</span>
                <strong id="kpiAbiertos">0</strong>
            </div>

            <div class="ticket-kpi">
                <span>En proceso</span>
                <strong id="kpiProceso">0</strong>
            </div>

            <div class="ticket-kpi">
                <span>Cerrados</span>
                <strong id="kpiCerrados">0</strong>
            </div>

        </div>

        <!-- Buscador -->

        <div class="ticket-toolbar">

            <div class="ticket-search">

                <i class="fa-solid fa-search"></i>

                <input
                    id="buscarTicket"
                    type="text"
                    placeholder="Buscar por folio o título...">

            </div>

            <div class="ticket-filters">

                <select id="filtroEstado">

                    <option value="">Todos los estados</option>
                    <option value="abierto">Abiertos</option>
                    <option value="proceso">En proceso</option>
                    <option value="cerrado">Cerrados</option>

                </select>

                <select id="filtroPrioridad">

                    <option value="">Todas las prioridades</option>
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                    <option value="critica">Crítica</option>

                </select>

            </div>

        </div>

        <!-- LISTA -->

        <div
            id="ticketsLista"
            class="ticket-list">

            <div class="ticket-card">

                <div style="text-align:center;padding:40px;">

                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>

                    <p style="margin-top:20px;">
                        Cargando tickets...
                    </p>

                </div>

            </div>

        </div>

    </section>

</main>





<script type="module" src="../js/auth-guard.js"></script>

<script type="module" src="../js/tickets.js"></script>



</body>


</html>
