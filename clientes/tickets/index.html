<!DOCTYPE html>
<html lang="es-MX">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Mis Tickets | Compu Desk
</title>


<link rel="icon" href="../../img/logo.png">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link rel="stylesheet" href="../css/cliente.css">


</head>


<body>



<header class="cliente-header">


<div class="brand">


<img src="../../img/logo.png">


<div>

<h2>
Compu Desk
</h2>


<span>
Portal Cliente
</span>


</div>


</div>



<div class="header-actions">


<a href="../dashboard.html" class="secondary-button">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>


</div>


</header>







<main class="cliente-container">

    <!-- CABECERA -->

    <section class="tickets-hero">

        <div>

            <h1>Mis Tickets</h1>

            <p>
                Consulta el estado de todas tus solicitudes de soporte.
            </p>

        </div>

        <a href="nuevo.html" class="primary-button">

            <i class="fa-solid fa-plus"></i>

            Nuevo Ticket

        </a>

    </section>



    <!-- KPIs -->

    <section class="tickets-kpis">

        <div class="ticket-kpi">

            <i class="fa-solid fa-ticket"></i>

            <div>

                <span>Total</span>

                <strong id="kpiTotal">0</strong>

            </div>

        </div>

        <div class="ticket-kpi">

            <i class="fa-solid fa-folder-open"></i>

            <div>

                <span>Abiertos</span>

                <strong id="kpiAbiertos">0</strong>

            </div>

        </div>

        <div class="ticket-kpi">

            <i class="fa-solid fa-spinner"></i>

            <div>

                <span>En proceso</span>

                <strong id="kpiProceso">0</strong>

            </div>

        </div>

        <div class="ticket-kpi">

            <i class="fa-solid fa-circle-check"></i>

            <div>

                <span>Cerrados</span>

                <strong id="kpiCerrados">0</strong>

            </div>

        </div>

    </section>



    <!-- FILTROS -->

    <section class="tickets-toolbar">

        <div class="search-box">

            <i class="fa-solid fa-search"></i>

            <input
                id="buscarTicket"
                type="text"
                placeholder="Buscar por folio o título...">

        </div>

        <select id="filtroEstado">

            <option value="">Todos</option>

            <option value="Abierto">Abiertos</option>

            <option value="Proceso">En proceso</option>

            <option value="Cerrado">Cerrados</option>

        </select>

    </section>



    <!-- LISTA -->

    <section id="ticketsLista" class="tickets-grid">

        <div class="ticket-loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <h3>Cargando tickets...</h3>

        </div>

    </section>

</main>





<script type="module" src="../js/auth-guard.js"></script>

<script type="module" src="../js/tickets.js"></script>



</body>


</html>
